<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Header */
      .header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        box-sizing: border-box;
        background: white;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }

      .tacho-placeholder {
        width: 200px;
        height: 200px;
        background: #e9ecf1;
        border-radius: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
        color: #666;
        margin: 0 auto;
      }

      .logout-placeholder {
        background: #dfe3e8;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        color: #555;
      }

      /* Main content */
      .content {
        margin-top: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      button {
        width: 220px;
        padding: 15px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #4a90e2;
        color: white;
        transition: 0.2s ease;
      }

      button:hover {
        background: #357ac9;
      }

      form {
        margin: 0;
      }
    </style>
  </head>

  <body>

    <!-- HEADER -->
    <div class="header">
      <div></div> <!-- Platzhalter links, damit das Tacho mittig bleibt -->

      <div class="tacho-placeholder">
        Tacho-Diagramm
      </div>

      <div class="logout-placeholder">
        Logout
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
      <form action="{{ url_for('notenuebersicht') }}" method="get">
        <button type="submit">Notenübersicht</button>
      </form>

      <form action="{{ url_for('termine') }}" method="get">
        <button type="submit">Terminübersicht</button>
      </form>
    </div>

  </body>
</html>
