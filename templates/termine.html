<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Termine</title>
</head>
<body>
    <a href="/">Zurück zum Menü</a> <br>
    <a href="notenübersicht">Zu der Notenübersicht</a>
    <h1>Termine</h1>

    <h2>Neuen Termin hinzufügen</h2>
    <form action="/appointments/add" method="post">
        <label>Titel:</label>
        <input type="text" name="title" required><br>

        <label>Beschreibung:</label>
        <input type="text" name="description"><br>

        <label>Datum:</label>
        <input type="date" name="date" required><br>

        <label>Kategorie:</label>
        <input type="text" name="category"><br>

        <button type="submit">Termin hinzufügen</button>
    </form>

    <h2>Alle Termine</h2>
    <ul>
        {% for appointment in appointments %}
            <li>
                {{ appointment["date"] }} - {{ appointment["title"] }} - {{ appointment["category"] }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
