<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notenmanager | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-top: #eef8f1;
        --bg-bottom: #fff4e9;
        --panel: rgba(255, 255, 255, 0.86);
        --text: #17301f;
        --muted: #5b6c60;
        --cta: #1f6f49;
        --cta-hover: #17573a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        background:
          linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .login-container {
        width: min(400px, 92vw);
        padding: 30px;
        border-radius: 26px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 { font-family: "Space Grotesk", sans-serif; margin-bottom: 20px; }
      .form-group { margin-bottom: 15px; text-align: left; }
      label { display: block; margin-bottom: 5px; font-weight: 500; }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: var(--cta);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn:hover { background: var(--cta-hover); }
      .messages { margin-bottom: 15px; }
      .messages p { color: #a03b13; margin: 0 0 5px; }
      .messages p.success { color: #1f6f49; } /* Grün für Erfolg */
      .register-link { display: block; margin-top: 15px; color: var(--cta); text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>Login</h1>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="messages">
            {% for category, message in messages %}
              <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label for="username">Benutzername</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Anmelden</button>
      </form>
      <a href="{{ url_for('register') }}" class="register-link">Noch kein Konto? Hier registrieren</a>
    </div>
  </body>
</html>
