<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notenmanager | Registrieren</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-top: #eef8f1;
        --bg-bottom: #fff4e9;
        --panel: rgba(255, 255, 255, 0.86);
        --text: #17301f;
        --cta: #1f6f49;
        --cta-hover: #17573a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .register-container {
        width: min(400px, 92vw);
        padding: 30px;
        border-radius: 26px;
        background: var(--panel);
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        text-align: center;
      }
      h1 { font-family: "Space Grotesk", sans-serif; margin-bottom: 20px; }
      .form-group { margin-bottom: 15px; text-align: left; }
      label { display: block; margin-bottom: 5px; font-weight: 500; }
      input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
      .btn { width: 100%; padding: 12px; background: var(--cta); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
      .btn:hover { background: var(--cta-hover); }
      .messages { color: #a03b13; margin-bottom: 15px; }
      .login-link { display: block; margin-top: 15px; color: var(--cta); text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="register-container">
      <h1>Registrieren</h1>
      
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="messages">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
          <label for="username">Benutzername</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="firstname">Vorname</label>
          <input type="text" id="firstname" name="firstname" required>
        </div>
        <div class="form-group">
          <label for="lastname">Nachname</label>
          <input type="text" id="lastname" name="lastname" required>
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Konto erstellen</button>
      </form>
      <a href="{{ url_for('login') }}" class="login-link">Bereits registriert? Zum Login</a>
    </div>
  </body>
</html>
